# Exa grading manifest for this Final Assessment coding challenge (Spring):
# best-effort first version, UNVERIFIED IN EXA. It mirrors the Foundation Java
# lab manifest (everything under 'test:') and is meant to drive both local Run
# Tests and grading.
#
# ASSUMPTION: no 'image' is declared, so Exa's documented fallback to the
# project's pinned runtime pack applies. The imported Exa Java template must
# supply JDK 25, Apache Maven 3.9 and this question's Spring Boot 4.1.2
# dependencies already available offline: the command runs Maven offline (-o)
# and there is no 'setup' step, so nothing is downloaded at test time.
#
# The command runs from the repository root. Surefire writes one JUnit XML
# report per test class under starter/target/surefire-reports/. Build and test
# errors stay visible: quiet mode (-q) prints only problems.
test:
  command: "mvn -q -B -o -f starter/pom.xml test"
  reports: "starter/target/surefire-reports/*.xml"
